name: check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      # no opencode on the runner, so the judged rules skip and CI covers the deterministic ones
      - run: python3 run.py --calibrate
